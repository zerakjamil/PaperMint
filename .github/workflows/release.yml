name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    name: Build & Publish macOS release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: PaperMint v__VERSION__
          releaseBody: |
            macOS build (Apple Silicon). Download the .dmg below.

            This beta is not notarized by Apple. First launch:
            1. Open the .dmg and drag PaperMint into Applications.
            2. Open PaperMint once; macOS blocks it with a security notice. Dismiss it.
            3. Go to System Settings -> Privacy & Security, scroll to the bottom, click "Open Anyway" next to PaperMint, and confirm.
            4. Open PaperMint again. It starts normally from now on.

            Terminal alternative: xattr -d com.apple.quarantine /Applications/PaperMint.app

            PaperMint runs fully offline; your exam files never leave your Mac.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
