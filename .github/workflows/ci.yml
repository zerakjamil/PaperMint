name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  rust:
    name: Cargo Check (src-tauri)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      # generate_context! requires frontendDist to exist; on a clean checkout dist/ is absent.
      # Placeholder keeps this job about Rust — the web job builds the real frontend.
      - run: mkdir -p dist && printf '<!doctype html><title>ci</title>' > dist/index.html
      - run: cargo check --manifest-path src-tauri/Cargo.toml
